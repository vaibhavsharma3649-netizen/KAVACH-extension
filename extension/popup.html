<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 380px; font: 13px/1.5 system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 14px; }
    h2 { font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: #334155; }
    .server-row { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; } .dot.on { background: #22c55e; } .dot.off { background: #ef4444; }
    textarea { width: 100%; height: 64px; border-radius: 8px; padding: 8px; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; resize: vertical; font: 12px/1.4 system-ui; }
    textarea:focus { outline: 1px solid #3b82f6; border-color: #3b82f6; }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    button { flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid #475569; cursor: pointer; font: 600 12px/1 system-ui; background: #1e293b; color: #e2e8f0; transition: all .15s; }
    button:hover { background: #334155; }
    #go { background: #166534; border-color: #22c55e; color: #fff; } #go:hover { background: #22c55e; }
    #stop { background: #991b1b; border-color: #ef4444; color: #fff; } #stop:hover { background: #dc2626; }
    .log-box { margin-top: 10px; max-height: 120px; overflow: auto; background: #1e293b; border-radius: 8px; padding: 8px; font-size: 11px; white-space: pre-wrap; color: #94a3b8; }
    .hint { font-size: 11px; color: #64748b; margin-top: 6px; }
  </style>
</head>
<body>
  <h2>🛡️ Vault Agent <span class="badge">PS26171</span></h2>
  <div class="server-row"><span class="dot" id="dot"></span><span id="srv-status">checking server...</span></div>
  <textarea id="task" placeholder="Click Approve and scroll to submit reports"></textarea>
  <div class="btn-row">
    <button id="go">▶ Run</button>
    <button id="stop">⏹ Stop</button>
  </div>
  <div class="hint">Blur auto-applies on page. Export for audit.</div>
  <button style="width:100%;margin-top:6px" id="export">Export Audit Log</button>
  <div class="log-box" id="log">Waiting...</div>
  <div id="t3" style="margin-top:10px;border-top:1px solid #334155;padding-top:10px">
    <label style="display:flex;align-items:center;gap:8px;font-weight:600"><input type="checkbox" id="t3-enabled" checked> KAVACH protection</label>
    <div style="display:flex;justify-content:space-between;margin-top:6px"><span>Agent fills flagged</span><b id="t3-agent">0</b></div>
    <div style="display:flex;justify-content:space-between"><span>Requests observed</span><b id="t3-obs">0</b></div>
    <div style="font-size:11px;color:#64748b">Background visibility only — domains seen, bodies never read here.</div>
    <div style="display:flex;justify-content:space-between"><span>PII sends blocked</span><b id="t3-block">0</b></div>
    <div style="font-size:11px;color:#64748b">Page-layer fetch/XHR block. Separate number, separate mechanism.</div>
    <ul id="t3-log" style="list-style:none;font-size:11px;color:#94a3b8;margin-top:6px"></ul>
    <button style="width:100%;margin-top:6px" id="t3-reset">Reset KAVACH counters</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
